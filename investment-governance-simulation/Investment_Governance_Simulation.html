<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Investment Governance Simulation</title>
<style>
  :root {
    --bg: #060a1c;
    --bg-2: #0b1233;
    --panel: rgba(36, 48, 120, 0.28);
    --panel-strong: rgba(52, 70, 170, 0.38);
    --line: rgba(130, 150, 255, 0.18);
    --line-strong: rgba(130, 150, 255, 0.38);
    --text: #eef1ff;
    --muted: #9ba7d8;
    --faint: #6a76a8;
    --accent: #4d6bff;
    --accent-2: #8a9cff;
    --good: #3ddc97;
    --warn: #ffb547;
    --bad: #ff6b7a;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    color: var(--text);
    background:
      radial-gradient(1200px 600px at 75% -10%, rgba(77, 107, 255, 0.28), transparent 60%),
      radial-gradient(900px 500px at 0% 100%, rgba(77, 107, 255, 0.14), transparent 60%),
      linear-gradient(180deg, var(--bg-2), var(--bg));
    background-color: var(--bg);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.45;
  }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 0 24px 32px; }

  /* Header */
  header.top {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 18px 0 14px; border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .brand b { font-size: 20px; letter-spacing: -0.2px; }
  .brand span { color: var(--muted); font-size: 18px; }
  .brand em { font-style: normal; font-size: 12px; color: var(--accent-2); border: 1px solid var(--line-strong); padding: 2px 10px; border-radius: 999px; }
  .top-right { display: flex; align-items: center; gap: 10px; }
  .chip { font-size: 13px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--panel); white-space: nowrap; }
  .chip.month { color: var(--text); font-weight: 600; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .btn {
    border: 1px solid var(--line-strong); background: var(--panel); border-radius: 999px;
    padding: 8px 18px; transition: background .2s, border-color .2s, opacity .2s;
  }
  .btn:hover:not(:disabled) { background: var(--panel-strong); border-color: var(--accent-2); }
  .btn:disabled { opacity: .35; cursor: not-allowed; }
  .btn.primary { background: var(--accent); border-color: var(--accent); font-weight: 600; }
  .btn.primary:hover:not(:disabled) { background: #6480ff; }
  .btn.small { padding: 5px 12px; font-size: 13px; }

  /* Money meter */
  .meter { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 16px 0 12px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; transition: border-color .4s, background .4s; }
  .tile .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
  .tile .v { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; font-variant-numeric: tabular-nums; }
  .tile.flash { border-color: var(--accent-2); background: var(--panel-strong); }
  .tile.warn { border-color: var(--bad); background: rgba(255, 107, 122, 0.14); }
  .tile.warn .v { color: var(--bad); }

  /* Swimlane */
  .lane-card { background: rgba(10, 16, 50, 0.55); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 8px 2px; }
  .lane-card svg { width: 100%; height: auto; display: block; }
  .legend { display: flex; gap: 18px; justify-content: flex-end; font-size: 12px; color: var(--muted); padding: 0 10px 8px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }

  /* Main */
  .main { display: grid; grid-template-columns: minmax(0, 2.1fr) minmax(280px, 1fr); gap: 16px; margin-top: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px 24px; }
  .stage-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  .letter { width: 40px; height: 40px; border-radius: 10px; background: var(--accent); display: grid; place-items: center; font-weight: 800; font-size: 20px; }
  .eyebrow { color: var(--muted); font-size: 13px; }
  .who { font-size: 13px; color: var(--accent-2); }
  h1 { font-size: 30px; margin: 6px 0 6px; letter-spacing: -0.6px; }
  h2 { font-size: 18px; margin: 20px 0 10px; }
  h3 { font-size: 15px; margin: 0 0 6px; }
  p { margin: 6px 0; }
  .lead { color: #cdd4ff; font-size: 16px; }
  .muted { color: var(--muted); }
  .star { color: #ffd166; }
  .badge-sharan { font-size: 12px; font-weight: 700; color: #1a1300; background: #ffd166; padding: 3px 10px; border-radius: 999px; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .ok { color: var(--good); font-weight: 600; }
  .pending { color: var(--warn); font-weight: 600; }
  .bad { color: var(--bad); font-weight: 600; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .stat { background: rgba(10, 16, 50, 0.45); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .stat .v { font-size: 22px; font-weight: 700; }
  .stat .k { font-size: 13px; color: var(--muted); }
  .stamp { display: inline-block; margin-top: 14px; padding: 6px 14px; border: 2px solid var(--good); color: var(--good); border-radius: 8px; font-weight: 700; letter-spacing: .6px; transform: rotate(-2deg); }

  .checklist { list-style: none; padding: 0; margin: 8px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; }
  .checklist li::before { content: "✓"; color: var(--good); font-weight: 700; margin-right: 8px; }

  /* Five questions */
  .fq { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 14px; }
  .fq-list { display: flex; flex-direction: column; gap: 6px; }
  .fq-item { display: flex; gap: 10px; align-items: center; text-align: left; border: 1px solid transparent; background: transparent; border-radius: 10px; padding: 9px 10px; }
  .fq-item .n { width: 26px; height: 26px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 13px; background: var(--panel-strong); }
  .fq-item.active { background: var(--accent); }
  .fq-item.active .n { background: rgba(255,255,255,.25); }
  .fq-item.seen:not(.active) .n { background: var(--good); color: #062a1a; }
  .fq-item:hover:not(.active) { border-color: var(--line-strong); }
  .fq-detail { background: linear-gradient(160deg, #3a56f0, #2a3fb8); border-radius: 14px; padding: 16px 18px; }
  .fq-detail .sub { font-size: 12px; color: #d8deff; text-transform: uppercase; letter-spacing: .5px; margin-top: 12px; }
  .fq-detail p { color: #f2f4ff; }
  .fq-detail table td, .fq-detail table th { border-color: rgba(255,255,255,.2); padding: 6px 8px; }
  .fq-detail table th { color: #d8deff; }

  /* Checks */
  .checks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .check { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: rgba(10, 16, 50, 0.45); }
  .check .lbl { font-size: 12px; color: var(--muted); }
  .check .res { font-size: 15px; font-weight: 700; margin-top: 4px; }
  .check.pass { border-color: rgba(61, 220, 151, 0.45); }
  .hurdle { margin: 10px 0 4px; }
  .hurdle .row { display: grid; grid-template-columns: 130px 1fr 150px; align-items: center; gap: 12px; margin: 8px 0; font-size: 14px; }
  .bar { position: relative; height: 12px; border-radius: 999px; background: rgba(255,255,255,.08); }
  .bar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--good); }
  .bar .mark { position: absolute; top: -5px; bottom: -5px; width: 2px; background: var(--warn); }

  /* Decisions */
  .decide { margin-top: 18px; padding: 16px 18px; border-radius: 14px; border: 1px dashed #ffd166; background: rgba(255, 209, 102, 0.06); }
  .options { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
  .opt { border: 1px solid var(--line-strong); background: var(--panel-strong); border-radius: 999px; padding: 10px 20px; font-weight: 600; }
  .opt:hover:not(:disabled) { border-color: #ffd166; }
  .opt.chosen { background: var(--accent); border-color: var(--accent); }
  .opt:disabled:not(.chosen) { opacity: .35; cursor: not-allowed; }
  .outcome { margin-top: 12px; padding: 12px 14px; border-radius: 10px; font-size: 14px; }
  .outcome.good { background: rgba(61, 220, 151, 0.12); border: 1px solid rgba(61, 220, 151, 0.45); }
  .outcome.warn { background: rgba(255, 107, 122, 0.12); border: 1px solid rgba(255, 107, 122, 0.5); }
  .rf-decision { margin-top: 16px; padding: 14px 16px; border-radius: 12px; background: rgba(61, 220, 151, 0.1); border: 1px solid rgba(61, 220, 151, 0.4); }
  .rf-decision b { color: var(--good); }

  /* Brief */
  .brief { border: 1px solid var(--line-strong); border-radius: 12px; overflow: hidden; }
  .brief .row { display: grid; grid-template-columns: 190px 1fr; border-bottom: 1px solid var(--line); }
  .brief .row:last-child { border-bottom: 0; }
  .brief .row > div { padding: 9px 12px; font-size: 14px; }
  .brief .row > div:first-child { color: var(--muted); background: rgba(10, 16, 50, 0.4); }

  /* Side */
  .side { display: flex; flex-direction: column; gap: 16px; }
  .side .card { padding: 16px 18px; }
  .side h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); margin-bottom: 10px; }
  .cond { display: grid; grid-template-columns: 32px 1fr auto; gap: 8px; align-items: start; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .cond:last-child { border-bottom: 0; }
  .cond .id { font-weight: 700; color: var(--accent-2); }
  .cond .meta { color: var(--muted); font-size: 12px; }
  .pill { font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .pill.notset { color: var(--faint); border: 1px solid var(--line); }
  .pill.pending { color: var(--warn); border: 1px solid rgba(255, 181, 71, .5); }
  .pill.ok { color: #062a1a; background: var(--good); }
  .log { list-style: none; padding: 0; margin: 0; font-size: 13.5px; }
  .log li { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .log li:last-child { border-bottom: 0; }
  .log .when { color: var(--muted); font-size: 12px; }
  .log .who.sc { color: #ffd166; }
  .empty { color: var(--faint); font-size: 13px; }

  /* Footer nav */
  .nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 18px; }
  .dots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .dot { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line-strong); background: transparent; font-size: 12px; color: var(--muted); }
  .dot.done { background: var(--panel-strong); color: var(--text); }
  .dot.current { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  .dot:disabled { cursor: not-allowed; opacity: .5; }
  .hint { text-align: center; color: var(--faint); font-size: 12px; margin-top: 10px; }

  .fade { animation: fade .35s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .fade { animation: none; } }

  @media (max-width: 980px) {
    .main { grid-template-columns: 1fr; }
    .meter { grid-template-columns: repeat(3, 1fr); }
    .fq, .grid2, .checks { grid-template-columns: 1fr; }
    .grid4 { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 600px) {
    .wrap { padding: 0 16px 24px; }
    .meter { grid-template-columns: 1fr 1fr; }
    .checklist { grid-template-columns: 1fr; }
    .brief .row { grid-template-columns: 1fr; }
    .hurdle .row { grid-template-columns: 1fr; gap: 4px; }
    h1 { font-size: 24px; }
    .top-right .chip:not(.month) { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <b>indegene</b><span>Investment Governance</span><em>Simulation</em>
    </div>
    <div class="top-right">
      <span class="chip">BU A · ClaimCheck</span>
      <span class="chip month" id="month">Month 0</span>
      <button class="btn small" id="restart" title="Restart the simulation">Restart</button>
    </div>
  </header>

  <section class="meter" aria-label="Money meter">
    <div class="tile" id="t-asked"><div class="k">Asked</div><div class="v">$1.5M</div></div>
    <div class="tile" id="t-approved"><div class="k">Approved</div><div class="v">—</div></div>
    <div class="tile" id="t-released"><div class="k">Released</div><div class="v">—</div></div>
    <div class="tile" id="t-spent"><div class="k">Spent</div><div class="v">—</div></div>
    <div class="tile" id="t-held"><div class="k">Held back</div><div class="v">—</div></div>
  </section>

  <section class="lane-card" aria-label="Who acts at each step">
    <svg id="lane" viewBox="0 0 1000 236" role="img" aria-label="Swimlane of the nine steps"></svg>
    <div class="legend">
      <span><i style="background:#ffd166"></i>Sharan decides (Steering Committee)</span>
      <span><i style="background:var(--accent)"></i>Done</span>
      <span><i style="border:2px solid var(--accent-2)"></i>Still to come</span>
    </div>
  </section>

  <section class="main">
    <article class="card" id="stage"></article>
    <aside class="side">
      <div class="card">
        <h3>Conditions</h3>
        <div id="conds"></div>
      </div>
      <div class="card">
        <h3>Decision log</h3>
        <ul class="log" id="log"></ul>
      </div>
    </aside>
  </section>

  <nav class="nav">
    <button class="btn" id="back">← Back</button>
    <div class="dots" id="dots"></div>
    <button class="btn primary" id="next">Next →</button>
  </nav>
  <div class="hint">Use ← → keys to move. All figures are illustrative.</div>
</div>

<script>
(function () {
  "use strict";

  // ---------- Data ----------
  var STEPS = [
    null, // 0 = intro
    { n: 1, letter: "R", stage: "Record baseline", lane: 2, node: "Baseline",          who: "S&O, with Finance", month: "Month 0" },
    { n: 2, letter: "E", stage: "Establish investment case", lane: 2, node: "Case submitted", who: "BU A, with S&O", month: "Month 0" },
    { n: 3, letter: "W", stage: "Weigh value & risks", lane: 1, node: "Recommends",    who: "Review Forum", month: "Month 0" },
    { n: 4, letter: "W", stage: "Weigh value & risks", lane: 0, node: "Decides",       who: "Steering Committee", month: "Month 0", sharan: true },
    { n: 5, letter: "A", stage: "Assess updates", lane: 2, node: "Monthly actuals",    who: "Finance reports · BU A explains · S&O reviews", month: "Months 1–3" },
    { n: 6, letter: "R", stage: "Review performance", lane: 1, node: "Checkpoint 1",   who: "Review Forum", month: "Month 3" },
    { n: 7, letter: "R", stage: "Review performance", lane: 1, node: "Checkpoint 2",   who: "Review Forum", month: "Month 8" },
    { n: 8, letter: "R", stage: "Review performance", lane: 0, node: "Decides",        who: "Steering Committee", month: "Month 12", sharan: true },
    { n: 9, letter: "D", stage: "Document outcomes", lane: 2, node: "Quarterly note",  who: "S&O, to the Steering Committee", month: "Quarter end" }
  ];
  var LAST = 9;

  var QUESTIONS = [
    {
      q: "Is the client problem real?",
      show: "Design-partner clients (not Indegene teams) who describe the problem, a buyer who owns the budget, and what they spend today.",
      ans: "<p>Two named clients describe the problem. The buyer is each client’s <b>head of MLR operations</b>, who owns the budget and spends about <b>$1.1M a year</b> on review cycles.</p><p>One design partner has signed a <b>letter of intent</b>.</p>"
    },
    {
      q: "What can be reused?",
      show: "Share of the build that is reusable, a ceiling on custom work per client [~20%], and a core already working for [2] use cases.",
      ans: "<p><b>60%</b> of the build reuses the Content SuperApp core, which already runs <b>2 use cases</b>.</p><p>Custom work per client: about <b>20%</b>, at the ceiling.</p>"
    },
    {
      q: "Build, partner or buy?",
      show: "A side-by-side: cost, time to first client, what we own (code, data rights, IP), and why ours is different.",
      ans: "<table><tr><th></th><th>Build</th><th>Vendor licence</th></tr>" +
           "<tr><td>Cost</td><td>$1.5M one-time</td><td>$0.4M every year</td></tr>" +
           "<tr><td>First paying client</td><td>Month 8</td><td>Month 4</td></tr>" +
           "<tr><td>What we own</td><td>Code, data rights, IP</td><td>Nothing</td></tr>" +
           "<tr><td>Uses our MLR reference library</td><td>Yes</td><td>No</td></tr></table>" +
           "<p><b>Build</b>: slower to start, but we own it and it uses data no one else has.</p>"
    },
    {
      q: "Is the plan realistic?",
      show: "Prototype, paid pilot and scale milestones with full cost: model usage, security review, client data access, support.",
      ans: "<p>Prototype by <b>month 3</b> · paid pilots by <b>month 8</b> · scale by <b>month 12</b>.</p>" +
           "<table><tr><th>Spend head</th><th class='num'>$M</th></tr>" +
           "<tr><td>Engineering team (6 people, 12 months)</td><td class='num'>0.72</td></tr>" +
           "<tr><td>GenAI model usage</td><td class='num'>0.18</td></tr>" +
           "<tr><td>Reference library &amp; data licences</td><td class='num'>0.15</td></tr>" +
           "<tr><td>Security &amp; privacy review</td><td class='num'>0.10</td></tr>" +
           "<tr><td>Client onboarding &amp; support</td><td class='num'>0.20</td></tr>" +
           "<tr><td>Contingency</td><td class='num'>0.15</td></tr>" +
           "<tr><th>Total</th><th class='num'>1.50</th></tr></table>"
    },
    {
      q: "Will clients pay?",
      show: "Price model, pilot terms, a pilot-to-paid plan, cost to serve per client, and revenue and margin at [3] clients.",
      ans: "<p>3-month paid pilot at <b>$60k</b>, credited against a <b>$300k a year</b> licence if the client converts.</p>" +
           "<p>Cost to serve: <b>$90k</b> per client per year.</p>" +
           "<p>At 3 clients: <b>$0.9M a year</b> revenue, about <b>70% margin</b>.</p>"
    }
  ];

  // ---------- State ----------
  var state;
  function fresh() {
    return { step: 0, max: 0, d4: null, d8: null, q: 0, seen: { 0: true }, preview: null };
  }
  state = fresh();

  // ---------- Derived ----------
  function money() {
    var s = state.step, approved = null, released = null, spent = null;
    if (s > 4 || (s === 4 && state.d4)) { approved = 1.5; released = 0.4; spent = 0; }
    if (s >= 5) spent = 0.40;
    if (s >= 6) released = 1.0;
    if (s >= 7) spent = 0.78;
    if (s >= 8) spent = 1.02;
    if (s > 8 || (s === 8 && state.d8)) released = 1.5;
    var held = approved === null ? null : +(approved - released).toFixed(2);
    var m = { approved: approved, released: released, spent: spent, held: held, warn: {} };
    if (state.preview) {
      for (var k in state.preview) m[k] = state.preview[k];
    }
    return m;
  }

  function conditions() {
    var s = state.step;
    var live = s > 4 || (s === 4 && state.d4);
    var c = [
      { id: "C1", t: "Design-partner agreement signed", meta: "BU A head · by month 3", st: "notset" },
      { id: "C2", t: "Security review passed before any client data is used", meta: "InfoSec · before data access", st: "notset" },
      { id: "C3", t: "Model usage at or below $15k a month", meta: "Product lead · monthly", st: "notset" }
    ];
    if (live) c.forEach(function (x) { x.st = "pending"; });
    if (s >= 5) c[2].st = "ok";
    if (s >= 6) { c[0].st = "ok"; c[1].st = "ok"; }
    return c;
  }

  function logEntries() {
    var s = state.step, L = [];
    if (s >= 1) L.push(["Month 0", "S&O", "Baseline locked"]);
    if (s >= 2) L.push(["Month 0", "BU A", "Case submitted: $1.5M"]);
    if (s >= 3) L.push(["Month 0", "Review Forum", "Recommends Approve in parts"]);
    if (s > 4 || (s === 4 && state.d4)) L.push(["Month 0", "Steering Committee", "Approved in parts · $0.4M released", true]);
    if (s >= 6) L.push(["Month 3", "Review Forum", "Continue · $0.6M released"]);
    if (s >= 7) L.push(["Month 8", "Review Forum", "Continue · no new money"]);
    if (s > 8 || (s === 8 && state.d8)) L.push(["Month 12", "Steering Committee", "Scale up · $0.5M released", true]);
    if (s >= 9) L.push(["Quarter end", "S&O", "Quarterly note sent"]);
    return L.reverse();
  }

  function canAdvance() {
    if (state.step === 4) return state.d4 === "parts";
    if (state.step === 8) return state.d8 === "scale";
    return state.step < LAST;
  }

  // ---------- Formatting ----------
  function fmt(v) {
    if (v === null || v === undefined) return "—";
    var t = (Math.round(v * 100) / 100).toFixed(2).replace(/0$/, "").replace(/\.0$/, "");
    if (t === "0.") t = "0";
    return "$" + t + "M";
  }

  function renderLane() {
    var svg = document.getElementById("lane");

    var lanes = [["Steering Committee", "Tier 2 · Sharan"], ["Review Forum", "Tier 1"], ["BU A · S&O · Finance", "Business"]];
    var colW = (right - left) / 9;
    function cx(n) { return left + (n - 0.5) * colW; }
    function cy(l) { return top + l * laneH + laneH / 2 - 6; }

    lanes.forEach(function (ln, i) {
      var y = top + i * laneH;
      svg.appendChild(el("rect", { x: 4, y: y, width: 992, height: laneH, fill: i % 2 ? "rgba(255,255,255,0.015)" : "rgba(255,255,255,0.035)" }));
      svg.appendChild(el("line", { x1: 4, x2: 996, y1: y, y2: y, stroke: "rgba(130,150,255,0.15)" }));
      svg.appendChild(el("text", { x: 16, y: y + laneH / 2 - 2, fill: "#eef1ff", "font-size": 14, "font-weight": 700 }, ln[0]));
      svg.appendChild(el("text", { x: 16, y: y + laneH / 2 + 15, fill: "#9ba7d8", "font-size": 11.5 }, ln[1]));
    });

    }
    // connectors
    for (n = 1; n < 9; n++) {
      var a = STEPS[n], b = STEPS[n + 1];
      var x1 = cx(n), y1 = cy(a.lane), x2 = cx(n + 1), y2 = cy(b.lane), mx = (x1 + x2) / 2;
      var done = state.step > n;
      svg.appendChild(el("path", {
        d: "M" + x1 + " " + y1 + " H" + mx + " V" + y2 + " H" + x2,
        fill: "none", stroke: done ? "#4d6bff" : "rgba(138,156,255,0.3)", "stroke-width": done ? 2.5 : 1.5,
        "stroke-dasharray": done ? "" : "4 4"

    // nodes

      st = STEPS[n];

      var isCur = state.step === n, isDone = state.step > n;
      var g = el("g", { style: "cursor:" + (n <= state.max ? "pointer" : "default") });
      if (isCur) g.appendChild(el("circle", { cx: x, cy: y, r: 22, fill: "rgba(77,107,255,0.35)" }));
      var fill = isDone ? "#4d6bff" : isCur ? "#4d6bff" : "#0b1233";
      var stroke = st.sharan ? "#ffd166" : "#8a9cff";
      if (st.sharan && (isDone || isCur)) fill = isCur ? "#4d6bff" : "#c9a53f";
      g.appendChild(el("circle", { cx: x, cy: y, r: 15, fill: fill, stroke: stroke, "stroke-width": 2 }));
      g.appendChild(el("text", { x: x, y: y + 5, "text-anchor": "middle", fill: "#fff", "font-size": 13, "font-weight": 700 }, String(n)));
      var label = st.node;
      if (n === 4 && (state.d4 === "parts" || state.step > 4)) label = "Approves in parts";
      if (n === 8 && (state.d8 === "scale" || state.step > 8)) label = "Scale up";
      if (n === 6 && state.step >= 6) label = "Continue";
      if (n === 7 && state.step >= 7) label = "Continue";
      g.appendChild(el("text", { x: x, y: y + 32, "text-anchor": "middle", fill: isCur ? "#ffffff" : "#b8c2f0", "font-size": 11.5, "font-weight": isCur ? 700 : 400, stroke: "#0a1030", "stroke-width": 4, "paint-order": "stroke" }, label));
      (function (target) {

      })(n);
      svg.appendChild(g);
    }
  }

  document.getElementById("next").addEventListener("click", function () { if (canAdvance()) go(state.step + 1); });
  document.getElementById("back").addEventListener("click", function () { if (state.step > 0) go(state.step - 1); });
  document.getElementById("restart").addEventListener("click", function () { state = fresh(); prevMoney = {}; render(true); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight" && canAdvance()) go(state.step + 1);
    if (e.key === "ArrowLeft" && state.step > 0) go(state.step - 1);
  });
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-q],[data-dec],[data-retry],[data-go],#again");
    if (!t) return;
    if (t.id === "again") { state = fresh(); prevMoney = {}; render(true); return; }
    if (t.hasAttribute("data-go")) { go(+t.getAttribute("data-go")); return; }
    if (t.hasAttribute("data-q")) {
      state.q = +t.getAttribute("data-q"); state.seen[state.q] = true; render(false); return;
    }
    if (t.hasAttribute("data-retry")) {
      var s = t.getAttribute("data-retry");
      state["try" + s] = null; state.preview = null; render(false); return;
    }
    if (t.hasAttribute("data-dec")) {
      var parts = t.getAttribute("data-dec").split(":"), step = parts[0], id = parts[1];
      if (step === "4") {
        if (id === "parts") { state.d4 = "parts"; state.try4 = null; state.preview = null; }
        else {
          state.try4 = id;
          state.preview = id === "full"
            ? { approved: 1.5, released: 1.5, spent: 0, held: 0, warn: { released: true, held: true } }
            : null;
        }
      } else {
        if (id === "scale") { state.d8 = "scale"; state.try8 = null; state.preview = null; }
        else { state.try8 = id; state.preview = { released: 1.0, held: 0.5, warn: { held: true } }; }
      }
      render(false);
    }
  });

  render(false);
})();
</script>
</body>
</html>
