<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Investment Governance Simulation</title>
<style>
  :root {
    --bg: #070b1f;
    --bg-2: #0d1538;
    --panel: rgba(40, 54, 130, 0.30);
    --panel-2: rgba(60, 80, 180, 0.40);
    --line: rgba(140, 160, 255, 0.20);
    --line-2: rgba(140, 160, 255, 0.40);
    --text: #eef1ff;
    --muted: #a2addb;
    --faint: #6f7bab;
    --accent: #4d6bff;
    --g: #3ddc97;
    --a: #ffb547;
    --r: #ff6b7a;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; color: var(--text);
    background: radial-gradient(1100px 560px at 80% -10%, rgba(77,107,255,.26), transparent 60%), linear-gradient(180deg, var(--bg-2), var(--bg));
    background-color: var(--bg);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; font-size: 16px; line-height: 1.5;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 0 20px 48px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 18px 0; }
  .brand b { font-size: 18px; } .brand span { color: var(--muted); margin-left: 8px; }
  .chip { font-size: 13px; color: var(--muted); border: 1px solid var(--line-2); border-radius: 999px; padding: 4px 12px; white-space: nowrap; }
  .progress { height: 4px; background: rgba(255,255,255,.08); border-radius: 999px; overflow: hidden; margin-bottom: 22px; }
  .progress i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px 28px; }
  .eyebrow { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .7px; }
  h1 { font-size: 30px; line-height: 1.2; margin: 6px 0 8px; letter-spacing: -.5px; }
  h2 { font-size: 19px; margin: 0 0 10px; }
  .lead { color: #cfd6ff; margin: 0 0 6px; }
  .muted { color: var(--muted); }
  button { font: inherit; color: inherit; cursor: pointer; }
  .btn { border: 1px solid var(--line-2); background: var(--panel); border-radius: 999px; padding: 10px 22px; }
  .btn:hover:not(:disabled) { background: var(--panel-2); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.primary { background: var(--accent); border-color: var(--accent); font-weight: 600; }
  .btn.link { border: 0; background: none; padding: 4px 0; color: #9fb0ff; text-decoration: underline; }
  .nav { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; gap: 12px; }

  /* Start */
  .types { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 20px 0 6px; }
  .type { text-align: left; border: 1px solid var(--line-2); background: rgba(10,16,50,.45); border-radius: 14px; padding: 18px; }
  .type:hover { border-color: #9fb0ff; }
  .type.sel { border-color: var(--accent); background: var(--panel-2); box-shadow: 0 0 0 2px var(--accent) inset; }
  .type .n { font-size: 26px; font-weight: 800; color: #8a9cff; }
  .type b { display: block; font-size: 17px; margin: 2px 0 6px; }
  .type span { color: var(--muted); font-size: 14px; }
  .steps { margin: 18px 0 0; padding-left: 20px; color: #cfd6ff; }
  .steps li { margin: 4px 0; }

  /* Questions */
  .q { padding: 18px 0; border-top: 1px solid var(--line); }
  .q:first-of-type { border-top: 0; padding-top: 6px; }
  .q label { display: block; font-weight: 600; font-size: 17px; }
  .q .hint { color: var(--faint); font-size: 14px; margin: 2px 0 8px; }
  .answer { display: flex; gap: 10px; align-items: flex-start; }
  textarea {
    flex: 1; min-height: 52px; resize: vertical; font: inherit; color: var(--text);
    background: rgba(5, 9, 30, .65); border: 1px solid var(--line-2); border-radius: 12px; padding: 12px 14px;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  .mic { flex: none; width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--line-2); background: var(--panel); display: grid; place-items: center; }
  .mic:hover { background: var(--panel-2); }
  .mic svg { width: 22px; height: 22px; }
  .mic.on { background: var(--r); border-color: var(--r); animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,107,122,.55); } 50% { box-shadow: 0 0 0 8px rgba(255,107,122,0); } }
  @media (prefers-reduced-motion: reduce) { .mic.on { animation: none; } }
  .live { font-size: 13px; color: var(--muted); margin-top: 6px; min-height: 0; }
  .live:empty { display: none; }
  audio { display: block; margin-top: 8px; height: 34px; max-width: 100%; }

  /* Review */
  .rsec { margin-top: 22px; }
  .rsec-head { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--line); padding-bottom: 6px; margin-bottom: 4px; }
  .rq { padding: 10px 0; border-bottom: 1px dashed var(--line); }
  .rq:last-child { border-bottom: 0; }
  .rq .qq { color: var(--muted); font-size: 14px; }
  .rq .aa { white-space: pre-wrap; }
  .rq .aa.none { color: var(--r); font-style: italic; }
  .notice { margin-top: 16px; padding: 12px 14px; border-radius: 10px; background: rgba(255,181,71,.10); border: 1px solid rgba(255,181,71,.45); font-size: 14px; }

  /* Evaluation one-pager */
  .ev-top { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .decision { margin: 18px 0 14px; border-radius: 14px; padding: 18px 20px; border: 1px solid; }
  .decision .lbl { font-size: 13px; text-transform: uppercase; letter-spacing: .7px; opacity: .85; }
  .decision .val { font-size: 28px; font-weight: 800; letter-spacing: -.4px; }
  .decision p { margin: 4px 0 0; }
  .d-g { border-color: var(--g); background: rgba(61,220,151,.10); } .d-g .val { color: var(--g); }
  .d-a { border-color: var(--a); background: rgba(255,181,71,.10); } .d-a .val { color: var(--a); }
  .d-r { border-color: var(--r); background: rgba(255,107,122,.10); } .d-r .val { color: var(--r); }
  .d-n { border-color: var(--line-2); background: rgba(255,255,255,.04); } .d-n .val { color: var(--muted); }
  .checks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .chk { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: rgba(5,9,30,.45); }
  .chk .t { font-size: 13px; color: var(--muted); }
  .chk .s { font-weight: 700; margin-top: 2px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 7px; vertical-align: 0; }
  .dot.g { background: var(--g); } .dot.a { background: var(--a); } .dot.r { background: var(--r); }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
  .box { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; background: rgba(5,9,30,.35); }
  .box h3 { margin: 0 0 8px; font-size: 14px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
  .box ol, .box ul { margin: 0; padding-left: 20px; } .box li { margin: 5px 0; font-size: 14.5px; }
  .box .none { color: var(--faint); font-size: 14px; }
  .route { margin-top: 14px; font-size: 14.5px; }
  .route b { color: #cfd6ff; }
  details { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 10px; }
  summary { cursor: pointer; color: #9fb0ff; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; margin-top: 8px; }
  td, th { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  .foot { margin-top: 14px; font-size: 12.5px; color: var(--faint); }
  .loading { text-align: center; padding: 40px 0; color: var(--muted); }

  @media (max-width: 680px) {
    .types, .checks, .cols { grid-template-columns: 1fr; }
    .card { padding: 20px 18px; }
    h1 { font-size: 24px; }
    .chip.hide-sm { display: none; }
  }
  @media print {
    body { background: #fff; color: #111; font-size: 12px; }
    header, .progress, .no-print, details { display: none !important; }
    .wrap { max-width: none; padding: 0; }
    .card { background: #fff; border: 0; padding: 0; }
    .lead, .muted, .route b, .chk .t, .box h3, .foot, .eyebrow { color: #444; }
    .chip { color: #333; border-color: #bbb; }
    .chk, .box { background: #fff; border-color: #ccc; }
    .decision { background: #fff !important; }
    h1 { font-size: 22px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><b>indegene</b><span>Investment Governance · Simulation</span></div>
    <div style="display:flex;gap:8px">
      <span class="chip hide-sm" id="chipType" hidden></span>
      <span class="chip" id="chipStep" hidden></span>
    </div>
  </header>
  <div class="progress"><i id="bar" style="width:0"></i></div>
  <main id="app"></main>
</div>

<script>
(function () {
  "use strict";

  // =================== Helpers for the guardrail rules ===================
  var HURDLE_MONTHS = 24;      // [indicative] payback / break-even hurdle
  var MIN_SIZE_M = 0.1;        // [indicative] governance threshold
  var WRITTEN_LIMIT_M = 0.5;   // [indicative] written approval limit

  function L(s) { return (s || "").toLowerCase(); }
  var WORDNUM = { zero: 0, none: 0, one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10, twelve: 12 };
  function nums(s) {
    s = L(s).replace(/,/g, "");
    var out = (s.match(/\d+(\.\d+)?/g) || []).map(parseFloat);
    Object.keys(WORDNUM).forEach(function (w) { if (new RegExp("\\b" + w + "\\b").test(s)) out.push(WORDNUM[w]); });
    return out;
  }
  function maxNum(s) { var n = nums(s); return n.length ? Math.max.apply(null, n) : null; }
  function pcts(s) { return (L(s).match(/\d+(\.\d+)?\s*%/g) || []).map(parseFloat); }
  function moneyM(s) {
    var m = L(s).replace(/,/g, "").match(/(\d+(\.\d+)?)\s*(million|mn|m|thousand|k)?\b/);
    if (!m) return null;
    var v = parseFloat(m[1]), u = m[3] || "";
    if (/^(million|mn|m)$/.test(u)) return v;
    if (/^(thousand|k)$/.test(u)) return v / 1000;
    return v >= 1000 ? v / 1e6 : v;
  }
  function dates(s) { return (L(s).match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\b|\bmonth\s*\d+|\bq[1-4]\b|\b20\d\d\b|\bweek\s*\d+/g) || []).length; }
  function words(s) { return (s || "").trim().split(/\s+/).filter(Boolean).length; }
  function has(s, re) { return re.test(L(s)); }
  function G(n) { return ["g", n]; } function A(n) { return ["a", n]; } function R(n) { return ["r", n]; }

  // =================== Questions ===================
  // q: question · h: example · g: guardrail (shown to the AI evaluator) · c: condition if amber · r: offline rule
  var ASK = { id: "ask", title: "The ask", sub: "Tell us what you want to invest in.", qs: [
    { id: "a1", q: "What is the investment, in one line?", h: "e.g. An AI tool that checks content claims before MLR review",
      g: "Green: a clear one-line description. Amber: vague.", c: "Restate the investment in one clear line",
      r: function (s) { return words(s) >= 6 ? G("Clear description") : A("Too short to understand"); } },
    { id: "a2", q: "How much are you asking for in total?", h: "e.g. $1.5M over 12 months",
      g: "Green: a total amount of [$0.1M] or more. Red: below [$0.1M] (normal budget, not governed). Amber: no amount.", c: "State the total amount",
      r: function (s) { var m = moneyM(s); if (m === null) return A("No amount given"); return m < MIN_SIZE_M ? R("Below [$0.1M]: use the normal budget") : G("$" + m + "M"); } },
    { id: "a3", q: "Who will use or pay for what this money buys?", h: "e.g. Pharma clients will pay a licence",
      g: "Green: clients use or pay for it. Amber: our own teams use it (that is archetype 04, not this one).", c: "Confirm clients are the ones who use or pay",
      r: function (s) { return has(s, /client|customer|pharma|brand|biotech/) ? G("Clients use or pay") : A("Sounds internal: check the archetype"); } }
  ]};

  var REAL = { id: "real", title: "Is it a real investment?", sub: "Quick facts about the money.", qs: [
    { id: "b1", q: "Is any of this amount already in your approved budget for this year?", h: "All, part, or none",
      g: "Green: none (new spend). Amber: part (only the extra is governed). Red: all of it (business as usual).", c: "Govern only the amount above the approved budget",
      r: function (s) {
        if (has(s, /part|some of|partly|half/)) return A("Part is already budgeted");
        if (has(s, /\bnone\b|\bnot\b|\bno\b|new spend/)) return G("New spend");
        if (has(s, /\ball\b|fully|entire|whole|yes/)) return R("Already budgeted: business as usual");
        return A("Unclear"); } },
    { id: "b2", q: "Is any part of this buying a company?", h: "Yes or no",
      g: "Green: no. Red: yes (M&A is handled separately).", c: "",
      r: function (s) { if (has(s, /\bno\b|\bnot\b/)) return G("Not M&A"); if (has(s, /\byes\b|acqui|buy(ing)? a company/)) return R("M&A is handled separately"); return A("Unclear"); } },
    { id: "b3", q: "In which month does spending start, and in which month does it end?", h: "e.g. January 2027 to December 2027",
      g: "Green: a start and an end. Red: no end (that is a running cost). Amber: only one date.", c: "Confirm the start and end month",
      r: function (s) { if (has(s, /ongoing|no end|indefinite|open.ended|permanent/)) return R("No end date: a running cost"); var d = dates(s); return d >= 2 ? G("Start and end given") : A("Add an end date"); } },
    { id: "b4", q: "Who is the one person accountable for results?", h: "One name or role",
      g: "Green: one person. Amber: two names. Red: a committee or shared ownership.", c: "Name one accountable owner",
      r: function (s) { if (has(s, /committee|jointly|shared|both/)) return R("No single owner"); if (has(s, /\band\b|\//)) return A("More than one name"); return G("One owner"); } },
    { id: "b5", q: "Which costs are included in your number?", h: "People, tools and licences, cloud or AI usage, vendors, security and compliance, onboarding and support",
      g: "Green: all relevant cost types listed. Amber: some missing. Red: hardly any listed.", c: "Add the missing cost lines before release",
      r: function (s) {
        var cats = { "people": /people|engineer|staff|hire|team|fte|headcount/, "tools": /tool|licen[cs]e|software/, "cloud/AI": /cloud|model|ai usage|hosting|compute|api/,
          "vendors": /vendor|partner|contractor|agency/, "security": /security|privacy|compliance|legal|certif/, "support": /support|onboarding|training/ };
        var miss = Object.keys(cats).filter(function (k) { return !cats[k].test(L(s)); });
        var n = 6 - miss.length;
        if (n >= 5) return G(n + " of 6 cost types listed");
        if (n >= 3) return A("Missing: " + miss.join(", "));
        return R("Most cost types missing"); } },
    { id: "b6", q: "After the investment period, what will it cost each year to keep it running, and which budget pays?", h: "e.g. $0.27M a year, paid from BU A's operating budget",
      g: "Green: an amount and who pays, or clearly self-funding from client work. Amber: amount without payer. Red: unknown.", c: "Agree which budget carries the running cost",
      r: function (s) {
        if (has(s, /don.t know|unknown|tbd|not sure/)) return R("Running cost unknown");
        if (has(s, /paid by client|billable|client projects|self.fund/)) return G("Paid by client work");
        if (nums(s).length && has(s, /budget|paid from|p&l|opex|operating|revenue/)) return G("Amount and payer given");
        if (nums(s).length) return A("Which budget pays?");
        return A("No running cost given"); } }
  ]};

  var ARCH = {
    "02": {
      name: "Client product, platform & reusable IP", short: "Client product & IP",
      blurb: "Building, licensing or buying a product, platform or IP that clients will use or pay for.",
      proof: "Clients willing to pay", first: "the prototype",
      sections: [
        { id: "p1", title: "Is the client problem real?", sub: "Who outside Indegene has this problem?", qs: [
          { id: "p1a", q: "How many clients outside Indegene have told you they have this problem? Name them.", h: "e.g. Three: Client X, Client Y, Client Z",
            g: "Green: 2 or more named external clients. Amber: 1. Red: none, or only Indegene teams.", c: "Get a second named client to confirm the problem",
            r: function (s) { if (has(s, /only (our|indegene|internal)|internal team/)) return R("Only internal teams"); var n = maxNum(s); if (n === null) return A("No number given"); return n >= 2 ? G(n + " clients") : n === 1 ? A("Only 1 client") : R("No clients"); } },
          { id: "p1b", q: "How far has your best design-partner client got?", h: "Verbal interest, letter of intent, or signed agreement",
            g: "Green: signed agreement. Amber: letter of intent or MoU. Red: verbal only or none.", c: "Sign a design-partner agreement before the next instalment",
            r: function (s) { if (has(s, /letter of intent|\bloi\b|\bmou\b/)) return A("Letter of intent only"); if (has(s, /not signed|unsigned/)) return A("Not yet signed"); if (has(s, /signed|contract/)) return G("Signed agreement"); if (has(s, /verbal|none|\bno\b/)) return R("Verbal only"); return A("Unclear"); } },
          { id: "p1c", q: "Who at the client owns the budget for this?", h: "A job title",
            g: "Green: a named role. Red: unknown.", c: "Identify the budget owner",
            r: function (s) { if (has(s, /unknown|not sure|don.t know|tbd/)) return R("Budget owner unknown"); return words(s) >= 2 ? G("Budget owner named") : A("Unclear"); } },
          { id: "p1d", q: "What do they spend on this problem today?", h: "e.g. About $1M a year",
            g: "Green: an amount. Amber: unknown.", c: "Confirm what clients spend today",
            r: function (s) { return nums(s).length ? G("Spend given") : A("Spend unknown"); } }
        ]},
        { id: "p2", title: "What can be reused?", sub: "How much already exists.", qs: [
          { id: "p2a", q: "Which existing Indegene asset does this build on?", h: "e.g. Content SuperApp core, or none",
            g: "Green: names an existing asset. Amber: none.", c: "Show which existing asset it builds on",
            r: function (s) { return has(s, /\bnone\b|nothing|from scratch/) ? A("Built from scratch") : G("Builds on existing asset"); } },
          { id: "p2b", q: "Roughly what share of the build already exists?", h: "e.g. 60%",
            g: "Green: 30% or more. Amber: under 30% or unknown.", c: "Show the reusable share of the build",
            r: function (s) { var p = pcts(s); if (!p.length) return A("No % given"); return p[0] >= 30 ? G(p[0] + "% exists") : A("Only " + p[0] + "% exists"); } },
          { id: "p2c", q: "How many use cases or clients does that core already run?", h: "A number",
            g: "Green: 1 or more. Amber: none.", c: "Prove the core in one use case before scaling",
            r: function (s) { var n = maxNum(s); if (n === null || n === 0 || has(s, /\bnone\b/)) return A("Core not proven yet"); return G(n + " running"); } },
          { id: "p2d", q: "How much custom work will each new client need?", h: "As a % of the build",
            g: "Green: [20%] or less. Amber: over [20%]. Red: over 40%.", c: "Cap custom work per client at [20%], shown in the prototype",
            r: function (s) { var p = pcts(s); if (!p.length) return A("No % given"); var v = p[0]; return v > 40 ? R(v + "%: every client is a rebuild") : v > 20 ? A(v + "%, above [20%]") : G(v + "%"); } }
        ]},
        { id: "p3", title: "Build, partner or buy?", sub: "Why build it ourselves?", qs: [
          { id: "p3a", q: "Did you price at least one partner or vendor option?", h: "Yes or no",
            g: "Green: yes. Amber: no.", c: "Price one partner or vendor option side by side",
            r: function (s) { if (has(s, /\bno\b|\bnot\b/)) return A("No alternative priced"); return has(s, /yes|priced|compared/) ? G("Alternative priced") : A("Unclear"); } },
          { id: "p3b", q: "For each option: what does it cost, and how many months to the first paying client?", h: "e.g. Build $1.5M, 8 months. Vendor $0.4M a year, 4 months",
            g: "Green: cost and time for at least two options. Amber: incomplete.", c: "Add cost and time to first client for each option",
            r: function (s) { return nums(s).length >= 2 ? G("Options compared") : A("Comparison incomplete"); } },
          { id: "p3c", q: "If we build, do we own the code, the data rights and the IP?", h: "Yes or no for each",
            g: "Green: yes to all. Amber: any no or partial.", c: "Secure code, data and IP rights",
            r: function (s) { if (has(s, /\bno\b|\bnot\b|partly|partial/)) return A("Not full ownership"); return has(s, /yes|own/) ? G("We own it") : A("Unclear"); } },
          { id: "p3d", q: "In one sentence, why is ours different?", h: "What no competitor or vendor has",
            g: "Green: a specific reason. Red: blank or generic.", c: "",
            r: function (s) { return words(s) >= 6 ? G("Clear difference") : R("No clear difference"); } }
        ]},
        { id: "p4", title: "Is the plan realistic?", sub: "Dates, team and full cost.", qs: [
          { id: "p4a", q: "What are the dates for the prototype, the first paid pilot and scale?", h: "e.g. March, August, December 2027",
            g: "Green: three dates. Amber: one or two. Red: none.", c: "Fix dates for prototype, paid pilot and scale",
            r: function (s) { var d = dates(s); return d >= 3 ? G("Milestones dated") : d >= 1 ? A("Some dates missing") : R("No dates"); } },
          { id: "p4b", q: "Is the build team in place, or still to be hired?", h: "In place, partly, or to be hired",
            g: "Green: in place. Amber: partly or to be hired.", c: "Name the build team before the first instalment is spent",
            r: function (s) { if (has(s, /partly|partial|some|to be hired|hire|recruit/)) return A("Team not fully in place"); return has(s, /in place|existing|already|yes/) ? G("Team in place") : A("Unclear"); } },
          { id: "p4c", q: "Does the plan include a security review and approval to use client data?", h: "Yes or no",

      s.qs.map(function (q) {
        return '<div class="q"><label for="ta-' + q.id + '">' + esc(q.q) + '</label><div class="hint">' + esc(q.h) + '</div>' +
          '<div class="answer"><textarea id="ta-' + q.id + '" data-id="' + q.id + '" rows="2" placeholder="Type your answer, or tap the mic">' + esc(state.answers[q.id] || "") + '</textarea>' +
          '<button class="mic" data-id="' + q.id + '" aria-label="Record answer" title="Speak your answer">' + MIC + '</button></div>' +
          '<div class="live" id="live-' + q.id + '"></div>' +
          '<div id="au-' + q.id + '">' + (audio[q.id] ? '<audio controls src="' + audio[q.id] + '"></audio>' : "") + '</div></div>';
      }).join("") +
      '</div>' +
      '<div class="nav"><button class="btn" id="prev">← Back</button>' +
      '<button class="btn primary" id="next">' + (state.step === secs.length - 1 ? "Review answers →" : "Next →") + '</button></div>';
    app.querySelectorAll("textarea").forEach(grow);
    var first = app.querySelector("textarea"); if (first && !first.value) first.focus();
  }

  function renderReview() {
    var missing = 0;
    var html = sections().map(function (s, i) {
      return '<div class="rsec"><div class="rsec-head"><h2 style="margin:0">' + (i + 1) + '. ' + esc(s.title) + '</h2><button class="btn link" data-edit="' + i + '">Edit</button></div>' +
        s.qs.map(function (q) {
          var a = (state.answers[q.id] || "").trim(); if (!a && !audio[q.id]) missing++;
          return '<div class="rq"><div class="qq">' + esc(q.q) + '</div>' +
            (a ? '<div class="aa">' + esc(a) + '</div>' : '<div class="aa none">' + (audio[q.id] ? "Audio only, not transcribed" : "Not answered") + '</div>') +
            (audio[q.id] ? '<audio controls src="' + audio[q.id] + '"></audio>' : "") + '</div>';
        }).join("") + '</div>';
    }).join("");
    app.innerHTML =
      '<div class="card"><div class="eyebrow">Review</div><h1>Your answers</h1>' +
      '<p class="lead">Check everything once. Use Edit to change a section.</p>' + html +
      (missing ? '<div class="notice">' + missing + ' question' + (missing > 1 ? "s are" : " is") + ' not answered. Unanswered questions count against the request.</div>' : "") +
      '</div>' +
      '<div class="nav"><button class="btn" id="prev">← Back</button><button class="btn primary" id="evaluate">Evaluate →</button></div>';
  }

  // =================== Evaluation ===================
  var DEC = {
    "Approve": "d-g", "Approve in parts": "d-a", "Send back": "d-a", "Decline": "d-r", "Not governed here": "d-n"
  };
  var NOT_GOVERNED = {
    a2: "Below [$0.1M]: use the BU’s normal budget process.",
    b1: "Already in the approved budget: this is business as usual.",
    b2: "M&A is handled separately.",
    d1a: "Hiring for an existing service follows the normal hiring process."
  };

  function offlineRatings() {
    return allQs().map(function (x) {
      var a = (state.answers[x.q.id] || "").trim();
      var r = a ? x.q.r(a) : (audio[x.q.id] ? A("Audio only, not transcribed") : R("Not answered"));
      return { id: x.q.id, sec: x.sec, q: x.q, answer: a, rag: r[0], note: r[1], condition: r[0] === "a" ? x.q.c : "" };
    });
  }

  function aiRatings() {
    var items = allQs().map(function (x) {
      return { id: x.q.id, section: x.sec.title, question: x.q.q, guardrail: x.q.g, conditionIfAmber: x.q.c, answer: (state.answers[x.q.id] || "").trim() };
    });
    var prompt =
      "You are the Strategy & Operations investment-governance evaluator. A BU owner has answered questions about an investment request " +
      "(archetype " + state.arch + ": " + ARCH[state.arch].name + "; proof required: " + ARCH[state.arch].proof + ").\n" +
      "Grade EACH answer strictly against its guardrail: g = meets it, a = partly meets it and can be fixed with a condition, r = fails, is missing, or is too vague to check. " +
      "An empty answer is r. Values in [ ] are indicative thresholds; apply them as written. Do not invent facts.\n" +
      "For each item give a note of at most 12 words quoting the answer's facts, and for every 'a' a condition of at most 14 words (adapt conditionIfAmber to the answer).\n" +
      "Also give: summary (two plain sentences for the Steering Committee: what is strong, what is the main risk), and paybackEstimate (one short line estimated from the year-by-year revenue and cost answers, or 'Not enough data').\n" +
      'Return JSON only: {"items":[{"id":"","rag":"g|a|r","note":"","condition":""}],"summary":"","paybackEstimate":""}\n\nItems:\n' +
      JSON.stringify(items);
    return sampler.json(prompt, { modelTier: "default" }).then(function (v) {
      if (!v || !Array.isArray(v.items)) throw new Error("bad shape");
      var byId = {}; v.items.forEach(function (it) { byId[it.id] = it; });
      var base = offlineRatings();
      var rows = base.map(function (b) {
        var it = byId[b.id];
        if (!it || !/^[gar]$/.test(it.rag)) return b;
        return { id: b.id, sec: b.sec, q: b.q, answer: b.answer, rag: it.rag, note: it.note || b.note, condition: it.rag === "a" ? (it.condition || b.q.c) : "" };
      });
      return { rows: rows, summary: v.summary || "", payback: v.paybackEstimate || "", mode: "AI-assisted evaluation against the guardrails" };
    });
  }

  function worst(list) { return list.some(function (r) { return r.rag === "r"; }) ? "r" : list.some(function (r) { return r.rag === "a"; }) ? "a" : "g"; }

  function decide(ev) {
    var rows = ev.rows;
    var arch = ARCH[state.arch];
    var archIds = arch.sections.map(function (s) { return s.id; });
    var c1 = rows.filter(function (r) { return r.sec.id === "ask" || r.sec.id === "real"; });
    var c2 = rows.filter(function (r) { return archIds.indexOf(r.sec.id) > -1; });
    var c3 = rows.filter(function (r) { return r.sec.id === "ret" || r.id === "p5e" || r.id === "d5c"; });
    var reds = rows.filter(function (r) { return r.rag === "r"; });
    var ambers = rows.filter(function (r) { return r.rag === "a"; });
    var ng = reds.filter(function (r) { return NOT_GOVERNED[r.id]; });
    var proofReds = c2.filter(function (r) { return r.rag === "r"; }).length;
    var amount = moneyM(state.answers.a2);

    var d, why, next;
    if (ng.length) {
      d = "Not governed here"; why = NOT_GOVERNED[ng[0].id];
      next = "Route the request to the right process. It does not go to the Review Forum.";
    } else if (proofReds >= 4) {
      d = "Decline"; why = "The proof is missing on " + proofReds + " points. The request is not ready to fund.";
      next = "Review Forum recommends Decline. The Steering Committee confirms.";
    } else if (reds.length) {
      d = "Send back"; why = reds.length + " answer" + (reds.length > 1 ? "s fail" : " fails") + " the guardrails. Fix " + (reds.length > 1 ? "them" : "it") + " and resubmit.";
      next = "Back to the BU owner. Resubmit to the Review Forum once the gaps are fixed.";
    } else if (ambers.length) {
      d = "Approve in parts"; why = "The case holds, but " + ambers.length + " point" + (ambers.length > 1 ? "s need" : " needs") + " proof. Release money in instalments, tied to conditions.";
      next = "Release only " + arch.first + ". Hold the rest until the conditions are met at the checkpoints.";
    } else {
      d = "Approve"; why = "Every answer meets the guardrails.";
      next = "Release the first instalment. Later instalments follow the checkpoints.";
    }
    var route = (d === "Not governed here" || d === "Send back") ? "" :
      "Review Forum reviews and recommends · Steering Committee decides" +
      (amount !== null ? (amount <= WRITTEN_LIMIT_M ? " · by written reply within [5] working days (under [$0.5M])" : " · in a meeting (over [$0.5M])") : "") +
      " · BU owner presents but does not vote.";
    function line(list) {
      var r = list.filter(function (x) { return x.rag === "r"; }).length, a = list.filter(function (x) { return x.rag === "a"; }).length;
      return r ? r + " gap" + (r > 1 ? "s" : "") + (a ? ", " + a + " to condition" : "") : a ? a + " point" + (a > 1 ? "s" : "") + " to condition" : "Meets the guardrails";
    }
    return {
      decision: d, why: why, next: next, route: route,
      checks: [
        { t: "Check 1 · Real investment?", rag: worst(c1), line: line(c1) },
        { t: "Check 2 · Proof good enough?", rag: worst(c2), line: line(c2) },
        { t: "Check 3 · Return worth it?", rag: worst(c3), line: line(c3) }
      ],
      reds: reds, ambers: ambers
    };
  }

  function evaluate() {
    stopAnyVoice();
    state.screen = "eval"; setHeader();
    app.innerHTML = '<div class="card loading">Evaluating against the guardrails…</div>';
    var p = sampler ? aiRatings().catch(function () { return null; }) : Promise.resolve(null);
    p.then(function (ev) {
      if (!ev) ev = { rows: offlineRatings(), summary: "", payback: "", mode: "Rule-based evaluation against the guardrails" + (sampler ? " (AI evaluation was unavailable)" : "") };
      ev.d = decide(ev); result = ev; renderEval();
    });
  }

  function renderEval() {
    if (!result) { state.screen = "review"; render(); return; }
    var ev = result, d = ev.d, arch = ARCH[state.arch];
    var name = (state.answers.a1 || "Investment request").trim();
    var amount = moneyM(state.answers.a2);
    var owner = (state.answers.b4 || "").trim().replace(/\.$/, "");
    var today = new Date().toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
    var autoSummary = ev.summary ||
      ("Strongest areas: " + (sections().filter(function (s) { return ev.rows.filter(function (r) { return r.sec.id === s.id; }).every(function (r) { return r.rag === "g"; }); }).map(function (s) { return s.title.replace(/\?$/, ""); }).join("; ") || "none fully green") + ". " +
       (d.reds.length ? "Main gaps: " + d.reds.slice(0, 3).map(function (r) { return r.note.toLowerCase(); }).join("; ") + "." :
        d.ambers.length ? "Main open points: " + d.ambers.slice(0, 3).map(function (r) { return r.note.toLowerCase(); }).join("; ") + "." : "No open points."));

    function list(items, empty, field) {
      return items.length ? "<ol>" + items.map(function (r) { return "<li>" + esc(field === "c" ? (r.condition || r.q.c) : r.note) + ' <span class="muted">(' + esc(r.sec.title.replace(/\?$/, "")) + ")</span></li>"; }).join("") + "</ol>" : '<div class="none">' + empty + "</div>";
    }

    app.innerHTML =
      '<div class="card">' +
      '<div class="ev-top"><div><div class="eyebrow">Evaluation summary</div><h1 style="margin-bottom:0">' + esc(name.length > 110 ? name.slice(0, 107) + "…" : name) + '</h1>' +
      '<div class="meta"><span class="chip">Archetype ' + state.arch + ' · ' + esc(arch.short) + '</span>' +
      (amount !== null ? '<span class="chip">Ask: $' + amount + 'M</span>' : "") +
      (owner ? '<span class="chip">Owner: ' + esc(owner.length > 40 ? owner.slice(0, 38) + "…" : owner) + '</span>' : "") +
      '<span class="chip">' + esc(today) + '</span></div></div></div>' +

      '<div class="decision ' + DEC[d.decision] + '"><div class="lbl">Recommendation</div><div class="val">' + esc(d.decision) + '</div><p>' + esc(d.why) + '</p></div>' +

      '<div class="checks">' + d.checks.map(function (c) {
        return '<div class="chk"><div class="t">' + esc(c.t) + '</div><div class="s"><span class="dot ' + c.rag + '"></span>' + esc(c.line) + '</div></div>';
      }).join("") + '</div>' +

      '<div class="cols">' +
        '<div class="box"><h3>Conditions to attach</h3>' + list(d.ambers, "None", "c") + '</div>' +
        '<div class="box"><h3>Must fix before funding</h3>' + list(d.reds, "None", "n") + '</div>' +
      '</div>' +

      '<div class="route"><p><b>Summary:</b> ' + esc(autoSummary) + '</p>' +
      (ev.payback ? '<p><b>Payback (estimate):</b> ' + esc(ev.payback) + ' Finance to confirm against the baseline and the [24-month] hurdle.</p>' :
        '<p><b>Payback:</b> Finance to calculate from the year-by-year figures and check against the baseline, the [24-month] hurdle and the downside case.</p>') +
      '<p><b>Next step:</b> ' + esc(d.next) + '</p>' +
      (d.route ? '<p><b>Who decides:</b> ' + esc(d.route) + '</p>' : "") + '</div>' +

      '<details><summary>See every answer’s rating</summary><table><tr><th></th><th>Question</th><th>Rating</th></tr>' +
      ev.rows.map(function (r) { return '<tr><td><span class="dot ' + r.rag + '"></span></td><td>' + esc(r.q.q) + '</td><td>' + esc(r.note) + '</td></tr>'; }).join("") +
      '</table></details>' +
      '<div class="foot">' + esc(ev.mode) + '. Values in [ ] are indicative. This is a recommendation to support the Review Forum and Steering Committee, not the decision itself.</div>' +
      '</div>' +
      '<div class="nav no-print"><button class="btn" id="edit">← Edit answers</button><div style="display:flex;gap:10px;flex-wrap:wrap">' +
      '<button class="btn" id="print">Print / save as PDF</button><button class="btn primary" id="restart">Start over</button></div></div>';
  }

  // =================== Events ===================
  app.addEventListener("input", function (e) {
    if (e.target.tagName === "TEXTAREA") { state.answers[e.target.dataset.id] = e.target.value; save(); grow(e.target); }
  });
  app.addEventListener("click", function (e) {
    var t = e.target.closest("button"); if (!t) return;
    if (t.dataset.arch) { if (state.arch !== t.dataset.arch) { state.arch = t.dataset.arch; save(); } renderStart(); return; }
    if (t.classList.contains("mic")) { toggleMic(t.dataset.id); return; }
    if (t.dataset.edit !== undefined) { state.step = +t.dataset.edit; state.screen = "section"; render(); return; }
    switch (t.id) {
      case "begin": state.screen = "section"; state.step = 0; render(); break;
      case "sample": state.answers = JSON.parse(JSON.stringify(SAMPLES[state.arch])); save(); state.screen = "review"; render(); break;
      case "clear": state.answers = {}; Object.keys(audio).forEach(function (k) { URL.revokeObjectURL(audio[k]); }); audio = {}; save(); renderStart(); break;
      case "prev": stopAnyVoice(); if (state.screen === "review") { state.screen = "section"; state.step = sections().length - 1; } else if (state.step === 0) state.screen = "start"; else state.step--; render(); break;
      case "next": stopAnyVoice(); if (state.step === sections().length - 1) state.screen = "review"; else state.step++; render(); break;
      case "evaluate": evaluate(); break;
      case "edit": state.screen = "review"; render(); break;
      case "print": window.print(); break;
      case "restart": state = { screen: "start", arch: null, step: 0, answers: {} }; audio = {}; result = null; save(); render(); break;
    }
  });

  render();
})();
</script>
</body>
</html>
