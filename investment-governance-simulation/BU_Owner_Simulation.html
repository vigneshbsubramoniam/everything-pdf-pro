<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Investment Governance Simulation</title>
<style>
  :root {
    --bg: #070b1f;
    --bg-2: #0d1538;
    --panel: rgba(40, 54, 130, 0.30);
    --panel-2: rgba(60, 80, 180, 0.40);
    --line: rgba(140, 160, 255, 0.20);
    --line-2: rgba(140, 160, 255, 0.40);
    --text: #eef1ff;
    --muted: #a2addb;
    --faint: #6f7bab;
    --accent: #4d6bff;
    --g: #3ddc97;
    --a: #ffb547;
    --r: #ff6b7a;
    --n: #6f7bab;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; color: var(--text);
    background: radial-gradient(1100px 560px at 80% -10%, rgba(77,107,255,.26), transparent 60%), linear-gradient(180deg, var(--bg-2), var(--bg));
    background-color: var(--bg);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; font-size: 16px; line-height: 1.5;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 20px 48px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 18px 0; }
  .brand b { font-size: 18px; } .brand span { color: var(--muted); margin-left: 8px; }
  .chip { font-size: 13px; color: var(--muted); border: 1px solid var(--line-2); border-radius: 999px; padding: 4px 12px; white-space: nowrap; }
  .progress { height: 4px; background: rgba(255,255,255,.08); border-radius: 999px; overflow: hidden; margin-bottom: 22px; }
  .progress i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px 28px; }
  .eyebrow { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .7px; }
  .eyebrow b { color: #9fb0ff; }
  h1 { font-size: 30px; line-height: 1.2; margin: 6px 0 8px; letter-spacing: -.5px; }
  h2 { font-size: 19px; margin: 0 0 10px; }
  .lead { color: #cfd6ff; margin: 0 0 6px; }
  .muted { color: var(--muted); }
  button { font: inherit; color: inherit; cursor: pointer; }
  .btn { border: 1px solid var(--line-2); background: var(--panel); border-radius: 999px; padding: 10px 22px; }
  .btn:hover:not(:disabled) { background: var(--panel-2); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.primary { background: var(--accent); border-color: var(--accent); font-weight: 600; }
  .btn.small { padding: 7px 14px; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
  .btn.small svg { width: 16px; height: 16px; }
  .btn.link { border: 0; background: none; padding: 4px 0; color: #9fb0ff; text-decoration: underline; }
  .nav { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; gap: 12px; }

  /* Start */
  .type { border: 1px solid var(--accent); background: var(--panel-2); border-radius: 14px; padding: 18px; margin: 18px 0 6px; }
  .type .n { font-size: 26px; font-weight: 800; color: #8a9cff; }
  .type b { display: block; font-size: 17px; margin: 2px 0 6px; }
  .type span { color: var(--muted); font-size: 14px; }
  .steps { margin: 18px 0 0; padding-left: 20px; color: #cfd6ff; }
  .steps li { margin: 4px 0; }
  .scope { margin-top: 14px; font-size: 14px; color: var(--faint); }

  /* Questions */
  .q { padding: 18px 0; border-top: 1px solid var(--line); }
  .q:first-of-type { border-top: 0; padding-top: 6px; }
  .q label { display: block; font-weight: 600; font-size: 17px; }
  .q .hint { color: var(--faint); font-size: 14px; margin: 2px 0 8px; }
  .answer { display: flex; gap: 10px; align-items: flex-start; }
  textarea {
    flex: 1; min-height: 52px; resize: vertical; font: inherit; color: var(--text);
    background: rgba(5, 9, 30, .65); border: 1px solid var(--line-2); border-radius: 12px; padding: 12px 14px;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  .mic { flex: none; width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--line-2); background: var(--panel); display: grid; place-items: center; }
  .mic:hover { background: var(--panel-2); }
  .mic svg { width: 22px; height: 22px; }
  .mic.on { background: var(--r); border-color: var(--r); animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,107,122,.55); } 50% { box-shadow: 0 0 0 8px rgba(255,107,122,0); } }
  @media (prefers-reduced-motion: reduce) { .mic.on { animation: none; } }
  .live { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .live:empty { display: none; }
  audio { display: block; margin-top: 8px; height: 34px; max-width: 100%; }
  .prefill { display: inline-block; font-size: 12px; font-weight: 600; color: #0b2a1c; background: var(--g); border-radius: 999px; padding: 2px 10px; margin-left: 8px; vertical-align: 2px; text-transform: none; letter-spacing: 0; }

  /* Attachments */
  .attach { border-top: 1px solid var(--line); padding-top: 16px; margin-top: 4px; }
  .attach .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .attach small { color: var(--faint); }
  .files { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .files:empty { display: none; }
  .file { display: inline-flex; align-items: center; gap: 8px; background: rgba(5,9,30,.6); border: 1px solid var(--line-2); border-radius: 10px; padding: 6px 8px 6px 10px; font-size: 14px; max-width: 100%; }
  .file img { width: 34px; height: 34px; object-fit: cover; border-radius: 6px; }
  .file a { color: var(--text); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 260px; }
  .file a:hover { text-decoration: underline; }
  .file small { color: var(--faint); }
  .file .x { border: 0; background: none; color: var(--muted); font-size: 18px; line-height: 1; padding: 0 4px; }
  .file .x:hover { color: var(--r); }

  /* Review */
  .rsec { margin-top: 22px; }
  .rsec-head { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--line); padding-bottom: 6px; margin-bottom: 4px; }
  .rq { padding: 10px 0; border-bottom: 1px dashed var(--line); }
  .rq:last-child { border-bottom: 0; }
  .rq .qq { color: var(--muted); font-size: 14px; }
  .rq .aa { white-space: pre-wrap; }
  .rq .aa.none { color: var(--r); font-style: italic; }
  .notice { margin-top: 16px; padding: 12px 14px; border-radius: 10px; background: rgba(255,181,71,.10); border: 1px solid rgba(255,181,71,.45); font-size: 14px; }

  /* Evaluation one-pager */
  .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .decision { margin: 18px 0 14px; border-radius: 14px; padding: 18px 20px; border: 1px solid; }
  .decision .lbl { font-size: 13px; text-transform: uppercase; letter-spacing: .7px; opacity: .85; }
  .decision .val { font-size: 28px; font-weight: 800; letter-spacing: -.4px; }
  .decision p { margin: 4px 0 0; }
  .d-g { border-color: var(--g); background: rgba(61,220,151,.10); } .d-g .val { color: var(--g); }
  .d-a { border-color: var(--a); background: rgba(255,181,71,.10); } .d-a .val { color: var(--a); }
  .d-r { border-color: var(--r); background: rgba(255,107,122,.10); } .d-r .val { color: var(--r); }
  .d-n { border-color: var(--line-2); background: rgba(255,255,255,.04); } .d-n .val { color: var(--muted); }
  .sect-h { font-size: 13px; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); margin: 18px 0 8px; }
  .reward { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .rw { border: 1px solid var(--line); border-radius: 12px; padding: 10px 11px; background: rgba(5,9,30,.45); }
  .rw .L { font-size: 22px; font-weight: 800; color: #8a9cff; line-height: 1; }
  .rw .nm { font-size: 12.5px; font-weight: 600; margin: 4px 0 6px; }
  .rw .st { font-size: 12.5px; font-weight: 700; }
  .rw .ln { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
  .rw.cur { border-color: var(--accent); background: var(--panel-2); }
  .rw.next { border-style: dashed; background: transparent; }
  .rw.next .L { color: var(--faint); }
  .rw-legend { font-size: 12.5px; color: var(--faint); margin: -2px 0 8px; }
  .checks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .chk { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: rgba(5,9,30,.45); }
  .chk .t { font-size: 13px; color: var(--muted); }
  .chk .s { font-weight: 700; margin-top: 2px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 7px; vertical-align: 0; }
  .dot.g { background: var(--g); } .dot.a { background: var(--a); } .dot.r { background: var(--r); } .dot.n { background: var(--n); }
  .numbers { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .num { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: rgba(5,9,30,.45); }
  .num .t { font-size: 13px; color: var(--muted); }
  .num .v { font-size: 22px; font-weight: 800; letter-spacing: -.3px; margin-top: 2px; }
  .num .s { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
  .box { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; background: rgba(5,9,30,.35); }
  .box h3 { margin: 0 0 8px; font-size: 14px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
  .box ol { margin: 0; padding-left: 20px; } .box li { margin: 5px 0; font-size: 14.5px; }
  .box .none { color: var(--faint); font-size: 14px; }
  .route { margin-top: 14px; font-size: 14.5px; }
  .route b { color: #cfd6ff; }
  details { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 10px; }
  summary { cursor: pointer; color: #9fb0ff; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; margin-top: 8px; }
  td, th { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  .foot { margin-top: 14px; font-size: 12.5px; color: var(--faint); }
  .loading { text-align: center; padding: 40px 0; color: var(--muted); }

  @media (max-width: 760px) { .reward { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 680px) {
    .checks, .cols { grid-template-columns: 1fr; }
    .numbers { grid-template-columns: 1fr 1fr; }
    .reward { grid-template-columns: repeat(2, 1fr); }
    .card { padding: 20px 18px; }
    h1 { font-size: 24px; }
    .chip.hide-sm { display: none; }
    .file a { max-width: 170px; }
  }
  @media print {
    body { background: #fff; color: #111; font-size: 11.5px; }
    header, .progress, .no-print, details { display: none !important; }
    .wrap { max-width: none; padding: 0; }
    .card { background: #fff; border: 0; padding: 0; }
    .lead, .muted, .route b, .chk .t, .box h3, .foot, .eyebrow, .sect-h, .rw .ln, .num .t, .num .s { color: #444; }
    .chip { color: #333; border-color: #bbb; }
    .chk, .box, .rw, .num { background: #fff !important; border-color: #ccc !important; }
    .decision { background: #fff !important; }
    h1 { font-size: 20px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><b>indegene</b><span>Investment Governance · Simulation</span></div>
    <div style="display:flex;gap:8px">
      <span class="chip hide-sm" id="chipType" hidden></span>
      <span class="chip" id="chipStep" hidden></span>
    </div>
  </header>
  <div class="progress"><i id="bar" style="width:0"></i></div>
  <main id="app"></main>
</div>

<script>
(function () {
  "use strict";

  // =================== Indicative thresholds (shown as [ ] on screen) ===================
  var HURDLE_MONTHS = 24;      // payback hurdle
  var DOWNSIDE_MONTHS = 36;    // downside-case payback limit
  var MIN_SIZE_M = 0.1;        // governance threshold
  var WRITTEN_LIMIT_M = 0.5;   // written-approval limit

  // =================== Helpers for the guardrail rules ===================
  function L(s) { return (s || "").toLowerCase(); }
  var WORDNUM = { zero: 0, none: 0, one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10, twelve: 12 };
  function nums(s) {
    s = L(s).replace(/,/g, "");
    var out = (s.match(/\d+(\.\d+)?/g) || []).map(parseFloat);
    Object.keys(WORDNUM).forEach(function (w) { if (new RegExp("\\b" + w + "\\b").test(s)) out.push(WORDNUM[w]); });
    return out;
  }
  function maxNum(s) { var n = nums(s); return n.length ? Math.max.apply(null, n) : null; }
  function pcts(s) { return (L(s).match(/\d+(\.\d+)?\s*%/g) || []).map(parseFloat); }
  // Finds a money amount in $M: prefers "$1.5M", "1.5 million", "900k"
  function moneyM(s) {
    s = L(s).replace(/,/g, "");
    var m = s.match(/\$\s*(\d+(\.\d+)?)\s*(million|mn|m|thousand|k)?\b/) || s.match(/(\d+(\.\d+)?)\s*(million|mn|m|thousand|k)\b/);
    if (!m) return null;
    var v = parseFloat(m[1]), u = m[3] || "";
    if (/^(million|mn|m)$/.test(u)) return v;
    if (/^(thousand|k)$/.test(u)) return v / 1000;
    return v >= 1000 ? v / 1e6 : v;
  }
  // Money amounts written with $ or a unit, in $M, in the order they appear
  function moneyList(s) {
    var out = [], re = /\$\s*(\d+(\.\d+)?)\s*(million|mn|m|thousand|k)?\b|(\d+(\.\d+)?)\s*(million|mn|m|thousand|k)\b/g, m;
    s = L(s).replace(/,/g, "");
    while ((m = re.exec(s))) {
      var v = parseFloat(m[1] || m[4]), u = m[3] || m[6] || "";
      out.push(/^(thousand|k)$/.test(u) ? v / 1000 : (!u && v >= 1000 ? v / 1e6 : v));
    }
    return out;
  }
  function r2(x) { return Math.round(x * 100) / 100; }
  // Reads "Revenue a, b, c. Cost x, y, z" and works out 3-year totals and the implied payback month
  function figures(s) {
    var t = L(s), i = t.search(/cost/), j = t.search(/revenue|savings|income/);
    if (i < 0 || j < 0) return null;
    var revPart = j < i ? t.slice(j, i) : t.slice(j), costPart = j < i ? t.slice(i) : t.slice(i, j);
    var rv = moneyList(revPart), cs = moneyList(costPart);
    if (rv.length < 2 || cs.length < 2) return null;
    var n = Math.min(rv.length, cs.length, 3), cum = 0, payback = null, rev = 0, cost = 0;
    for (var k = 0; k < n; k++) {
      var net = rv[k] - cs[k]; rev += rv[k]; cost += cs[k];
      if (payback === null && net > 0 && cum + net >= 0) payback = Math.round(k * 12 + (-cum / net) * 12);
      cum += net;
    }
    return { rev: r2(rev), cost: r2(cost), net: r2(rev - cost), payback: payback, years: n };
  }
  // Picks the downside payback months from a sentence like "payback is about 35 months"
  function downsideMonths(s) {
    var m = L(s).match(/(\d+(\.\d+)?)\s*(months?|yrs?|years?)/g);
    if (!m) return null;
    var last = m[m.length - 1], v = parseFloat(last);
    return /y/.test(last.replace(/\d|\.|\s/g, "")) ? Math.round(v * 12) : v;
  }
  function dates(s) { return (L(s).match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\b|\bmonth\s*\d+|\bq[1-4]\b|\b20\d\d\b/g) || []).length; }
  function words(s) { return (s || "").trim().split(/\s+/).filter(Boolean).length; }
  function has(s, re) { return re.test(L(s)); }
  function G(n) { return ["g", n]; } function A(n) { return ["a", n]; } function R(n) { return ["r", n]; }
  function short(s, n) { s = (s || "").trim().replace(/\.$/, ""); n = n || 70; return s.length > n ? s.slice(0, n - 1) + "…" : s; }

  // =================== The archetype ===================
  var ARCH = {
    code: "02", name: "Client product, platform & reusable IP", short: "Client product & IP",
    blurb: "Building, licensing or buying a product, platform or IP that clients will use or pay for.",
    proof: "Clients willing to pay",
    first: "the first instalment (prototype)",
    checkpoints: "Prototype by month [3] · paid pilots by month [6–9] · scale by month [12]"
  };

  // =================== Questions ===================
  // q: question · h: example (or data source) · g: guardrail (for the AI evaluator) · c: condition if amber · r: offline rule
  var SECTIONS = [
    { id: "ask", tag: "<b>E</b> · Establish the case", title: "The ask", sub: "What you want, and why now.", qs: [
      { id: "a1", q: "What is the investment, and how much do you need in total?", h: "e.g. ClaimCheck, an AI claims pre-check before MLR review: $1.5M over 12 months",
        g: "Green: a clear one-line description and a total of [$0.1M] or more. Red: below [$0.1M] (normal budget, not governed). Amber: no amount or unclear description.",
        c: "State what it is and the total amount",
        r: function (s) { var m = moneyM(s); if (m === null) return A("No amount given"); if (m < MIN_SIZE_M) return R("Below [$0.1M]: use the normal budget"); return words(s) >= 6 ? G("$" + m + "M, clear ask") : A("$" + m + "M, but describe it in a line"); } },
      { id: "a2", q: "What happens if we don’t invest?", h: "e.g. Clients move to a vendor, and we keep paying $0.84M a year for manual checks",
        g: "Green: a concrete consequence (lost clients, revenue or cost). Amber: vague.", c: "State what we lose if we don’t invest",
        r: function (s) { return words(s) >= 6 ? G("Cost of not investing stated") : A("Vague"); } }
    ]},

    { id: "base", soft: true, prefilled: true, tag: "<b>R</b> · Record baseline", title: "Where are you today?",
      sub: "S&O has pre-filled this from Finance, HR and CRM. Check it and edit anything that’s wrong.", qs: [
      { id: "s1", q: "What does the BU spend on this area today?", h: "Source: Finance system",
        g: "Green: an amount, or nothing because it is new.", c: "S&O to confirm today’s spend from the Finance system",
        r: function (s) { return nums(s).length || has(s, /nothing|\bnone\b|\bnew\b|zero/) ? G("Spend recorded") : A("S&O to confirm"); } },
      { id: "s2", q: "How many people work on it today?", h: "Source: HR system and timesheets",
        g: "Green: a headcount or hours.", c: "S&O to confirm headcount from HR",
        r: function (s) { return nums(s).length || has(s, /\bnone\b|nobody|zero/) ? G("Headcount recorded") : A("S&O to confirm"); } },
      { id: "s3", q: "What do clients pay us for it today?", h: "Source: CRM",
        g: "Green: an amount or a clear statement.", c: "S&O to confirm current revenue from CRM",
        r: function (s) { return words(s) >= 2 ? G("Current revenue recorded") : A("S&O to confirm"); } }
    ]},

    { id: "real", tag: "<b>E</b> · Feeds Check 1: Real investment?", title: "Is it a real investment?", sub: "Three quick facts about the money.", qs: [
      { id: "b1", q: "Is any of this already in your approved budget for this year?", h: "All, part, or none",
        g: "Green: none (new spend). Amber: part (only the extra is governed). Red: all of it (business as usual).", c: "Govern only the amount above the approved budget",
        r: function (s) {
          if (has(s, /part|some of|partly|half/)) return A("Part is already budgeted");
          if (has(s, /\bnone\b|\bnot\b|\bno\b|new spend/)) return G("New spend");
          if (has(s, /\ball\b|fully|entire|whole|yes/)) return R("Already budgeted: business as usual");
          return A("Unclear"); } },
      { id: "b2", q: "In which month does spending start, and in which month does it end?", h: "e.g. January 2027 to December 2027",
        g: "Green: a start and an end. Red: no end (that is a running cost). Amber: only one date.", c: "Confirm the start and end month",
        r: function (s) { if (has(s, /ongoing|no end|indefinite|open.ended|permanent/)) return R("No end date: a running cost"); return dates(s) >= 2 ? G("Start and end given") : A("Add an end date"); } },
      { id: "b3", q: "Who is the one person accountable for results?", h: "One name or role",
        g: "Green: one person. Amber: two names. Red: a committee or shared ownership.", c: "Name one accountable owner",
        r: function (s) { if (has(s, /committee|jointly|shared|both/)) return R("No single owner"); if (has(s, /\band\b|\//)) return A("More than one name"); return G("One owner"); } }
    ]},

    { id: "p1", title: "Is the client problem real?", sub: "Who outside Indegene has this problem?", qs: [
      { id: "p1a", q: "Which clients outside Indegene have this problem, and who at each owns the budget?", h: "e.g. Three: Client X, Y and Z. The head of MLR operations owns the budget",
        g: "Green: 2 or more named external clients and the budget owner. Amber: 1 client, or budget owner missing. Red: none, or only Indegene teams.",
        c: "Name a second client and each budget owner",
        r: function (s) {
          if (has(s, /only (our|indegene|internal)|internal team/)) return R("Only internal teams");
          var n = maxNum(s), owner = has(s, /head|director|vp|chief|owner|budget|lead|manager/);
          if (n === 0) return R("No clients");
          if (n === null) return owner ? A("Number of clients unclear") : A("Clients and budget owner unclear");
          if (n >= 2) return owner ? G(n + " clients, budget owner named") : A(n + " clients, budget owner not named");
          return A("Only 1 client"); } },
      { id: "p1b", q: "How far has your best design-partner client got?", h: "Verbal interest, letter of intent, or signed agreement",
        g: "Green: signed agreement. Amber: letter of intent or MoU. Red: verbal only or none.", c: "Sign a design-partner agreement before the next instalment",

  function appendText(id, text) {

      (missing ? '<div class="notice">' + missing + ' question' + (missing > 1 ? "s are" : " is") + ' not answered. Unanswered questions count against the request, unless a file in that section covers them.</div>' : "") +
      '</div>' +
      '<div class="nav"><button class="btn" id="prev">← Back</button><button class="btn primary" id="evaluate">Evaluate →</button></div>';
  }

  // =================== Evaluation ===================
  var DEC = { "Approve": "d-g", "Approve in parts": "d-a", "Send back": "d-a", "Decline": "d-r", "Not governed here": "d-n" };
  var NOT_GOVERNED = {
    a1: "Below [$0.1M]: use the BU’s normal budget process.",
    b1: "Already in the approved budget: this is business as usual."
  };

  function offlineRatings() {
    return allQs().map(function (x) {
      var a = (state.answers[x.q.id] || "").trim(), secFiles = files[x.sec.id] || [], r;
      if (a) r = x.q.r(a);
      else if (secFiles.length) r = A("Not typed: see attached " + secFiles.map(function (f) { return f.name; }).join(", "));
      else if (audio[x.q.id]) r = A("Audio only, not transcribed");
      else r = x.sec.soft ? A("Not given: S&O to confirm") : R("Not answered");
      var cond = r[0] === "a" ? (!a && secFiles.length ? "S&O and Finance to verify the attached evidence" : x.q.c) : "";
      return { id: x.q.id, sec: x.sec, q: x.q, answer: a, rag: r[0], note: r[1], condition: cond };
    });
  }

  // AI evaluation: only when published on claude.ai. Reads CSV/Excel text and images where possible.
  function loadXLSX() {
    return new Promise(function (res) {
      if (window.XLSX) return res(window.XLSX);
      var s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
      s.onload = function () { res(window.XLSX || null); }; s.onerror = function () { res(null); };
      document.head.appendChild(s); setTimeout(function () { res(window.XLSX || null); }, 8000);
    });
  }
  function fileText(f) {
    if (/\.(csv|txt)$/i.test(f.name)) return f.file.text().then(function (t) { return t.slice(0, 6000); });
    if (/\.xlsx?$/i.test(f.name)) return loadXLSX().then(function (X) {
      if (!X) return null;
      return f.file.arrayBuffer().then(function (buf) {
        var wb = X.read(buf, { type: "array" });
        return wb.SheetNames.map(function (n) { return "Sheet " + n + ":\n" + X.utils.sheet_to_csv(wb.Sheets[n]); }).join("\n").slice(0, 6000);
      });
    }).catch(function () { return null; });
    return Promise.resolve(null);
  }
  function aiRatings() {
    var fl = allFiles();
    return Promise.all(fl.map(function (x) { return fileText(x.f); })).then(function (texts) {
      var items = allQs().map(function (x) {
        return { id: x.q.id, section: x.sec.title, question: x.q.q, guardrail: x.q.g, conditionIfAmber: x.q.c, answer: (state.answers[x.q.id] || "").trim(), optional: !!x.sec.soft };
      });
      var att = fl.map(function (x, i) { return { section: x.sec.title, name: x.f.name, content: texts[i] || "(not readable as text)" }; });
      var images = fl.filter(function (x) { return isImg(x.f); }).slice(0, 4).map(function (x) { return x.f.file; });
      var prompt =
        "You are the Strategy & Operations investment-governance evaluator. A BU owner has answered questions about an investment request " +
        "(archetype " + ARCH.code + ": " + ARCH.name + "; proof required: " + ARCH.proof + ").\n" +
        "Grade EACH answer strictly against its guardrail: g = meets it, a = partly meets it and can be fixed with a condition, r = fails, is missing, or is too vague to check. " +
        "An empty answer is r, unless an attachment in the same section clearly answers it (then grade from the attachment), or the item is optional (then a). Values in [ ] are indicative thresholds; apply them as written. Do not invent facts.\n" +
        "For each item give a note of at most 12 words quoting the facts, and for every 'a' a condition of at most 14 words (adapt conditionIfAmber).\n" +
        "Also give: summary (two plain sentences for the Steering Committee: what is strong, what is the main risk) and paybackEstimate (one short line from the year-by-year figures or an attached business case, or 'Not enough data').\n" +
        'Return JSON only: {"items":[{"id":"","rag":"g|a|r","note":"","condition":""}],"summary":"","paybackEstimate":""}\n\nItems:\n' + JSON.stringify(items) +
        (att.length ? "\n\nAttachments:\n" + JSON.stringify(att) : "");
      var opts = { modelTier: "default" };
      var lim = sampler.limits ? Promise.resolve().then(function () { return sampler.limits(); }).catch(function () { return null; }) : Promise.resolve(null);
      return lim.then(function (l) { if (images.length && l && l.images) opts.images = images; return sampler.json(prompt, opts); });
    }).then(function (v) {
      if (!v || !Array.isArray(v.items)) throw new Error("bad shape");
      var byId = {}; v.items.forEach(function (it) { byId[it.id] = it; });
      var rows = offlineRatings().map(function (b) {
        var it = byId[b.id];
        if (!it || !/^[gar]$/.test(it.rag)) return b;
        return { id: b.id, sec: b.sec, q: b.q, answer: b.answer, rag: it.rag, note: it.note || b.note, condition: it.rag === "a" ? (it.condition || b.q.c) : "" };
      });
      return { rows: rows, summary: v.summary || "", payback: v.paybackEstimate || "", mode: "AI-assisted evaluation against the guardrails" };
    });
  }

  function worst(list) { return list.some(function (r) { return r.rag === "r"; }) ? "r" : list.some(function (r) { return r.rag === "a"; }) ? "a" : "g"; }

  function decide(ev) {
    var rows = ev.rows;
    var inSec = function (ids) { return rows.filter(function (r) { return ids.indexOf(r.sec.id) > -1; }); };
    var c1 = inSec(["ask", "real"]), c2 = inSec(["p1", "p2", "p3", "p4", "p5"]);
    var c3 = rows.filter(function (r) { return r.sec.id === "ret" || r.id === "p5b"; });
    var caseRows = rows.filter(function (r) { return !r.sec.prefilled; });
    var reds = caseRows.filter(function (r) { return r.rag === "r"; });
    var ambers = rows.filter(function (r) { return r.rag === "a"; });
    var ng = reds.filter(function (r) { return NOT_GOVERNED[r.id] && r.answer; });
    var proofReds = c2.filter(function (r) { return r.rag === "r" && r.answer; }).length; // unanswered questions mean "send back", not "decline"
    var amount = moneyM(state.answers.a1);

    var d, why, next;
    if (ng.length) { d = "Not governed here"; why = NOT_GOVERNED[ng[0].id]; next = "Route the request to the right process. It does not go to the Review Forum."; }
    else if (proofReds >= 4) { d = "Decline"; why = "The proof is missing on " + proofReds + " points. The request is not ready to fund."; next = "Review Forum recommends Decline. The Steering Committee confirms."; }
    else if (reds.length) { d = "Send back"; why = reds.length + " answer" + (reds.length > 1 ? "s fail" : " fails") + " the guardrails. Fix " + (reds.length > 1 ? "them" : "it") + " and resubmit."; next = "Back to the BU owner. Resubmit to the Review Forum once the gaps are fixed."; }
    else if (ambers.length) { d = "Approve in parts"; why = "The case holds, but " + ambers.length + " point" + (ambers.length > 1 ? "s need" : " needs") + " proof. Release money in instalments, tied to conditions."; next = "Release only " + ARCH.first + ". Hold the rest until the conditions are met at the checkpoints."; }
    else { d = "Approve"; why = "Every answer meets the guardrails."; next = "Release the first instalment. Later instalments follow the checkpoints."; }
    var funded = d === "Approve" || d === "Approve in parts";
    var route = !funded && d !== "Decline" ? "" :
      "Review Forum reviews and recommends · Steering Committee decides" +
      (amount !== null ? (amount <= WRITTEN_LIMIT_M ? " · by written reply within [5] working days (up to [$0.5M])" : " · in a meeting (over [$0.5M])") : "") +
      " · BU owner presents but does not vote.";
    function line(list) {
      var r = list.filter(function (x) { return x.rag === "r"; }).length, a = list.filter(function (x) { return x.rag === "a"; }).length;
      return r ? r + " gap" + (r > 1 ? "s" : "") + (a ? ", " + a + " to condition" : "") : a ? a + " point" + (a > 1 ? "s" : "") + " to condition" : "Meets the guardrails";
    }
    var checks = [
      { t: "Check 1 · Real investment?", rag: worst(c1), line: line(c1) },
      { t: "Check 2 · Proof good enough?", rag: worst(c2), line: line(c2) },
      { t: "Check 3 · Return worth it?", rag: worst(c3), line: line(c3) }
    ];

    // REWARD view
    var A_ = state.answers, base = inSec(["base"]);
    var answered = caseRows.filter(function (r) { return r.answer || (files[r.sec.id] || []).length; }).length;
    var nFiles = allFiles().length;
    var plan = rows.filter(function (r) { return r.id === "p4a"; })[0];
    var risk = rows.filter(function (r) { return r.id === "r3"; })[0];
    var reward = [
      { L: "R", nm: "Record baseline", st: worst(base), lbl: worst(base) === "g" ? "Done" : "To confirm",
        ln: worst(base) === "g" ? "Spend: " + short(A_.s1, 40) + " · People: " + short(A_.s2, 40) : "S&O to confirm from Finance, HR and CRM" },
      { L: "E", nm: "Establish case", st: answered === caseRows.length ? "g" : caseRows.length - answered <= 3 ? "a" : "r", lbl: answered === caseRows.length ? "Done" : "Incomplete",
        ln: answered + " of " + caseRows.length + " answered" + (nFiles ? " · " + nFiles + " file" + (nFiles > 1 ? "s" : "") + " attached" : "") },
      { L: "W", nm: "Weigh value & risks", st: { "d-g": "g", "d-a": "a", "d-r": "r", "d-n": "n" }[DEC[d]], lbl: d, ln: "Three checks → " + d, cur: true },
      // A, R and D happen after approval, so they show what comes next, not a status
      { L: "A", nm: "Assess updates", next: true, st: "n", lbl: funded ? "Next · monthly" : "Not started",
        ln: funded ? "Finance reports spend vs plan; BU explains variances; S&O reviews. Watch: " + (risk && risk.rag === "g" ? short((A_.r3 || "").replace(/^\s*biggest risk\s*:\s*/i, "").split(/[.;]/)[0], 48) : "biggest risk, to be named") : "Only if funded" },
      { L: "R", nm: "Review performance", next: true, st: "n", lbl: funded ? "Next · each checkpoint" : "Not started",
        ln: funded ? ARCH.checkpoints + ". " + (plan && plan.rag === "g" ? "Each releases the next instalment" : "Milestones still to be dated") : "Only if funded" },
      { L: "D", nm: "Document outcomes", next: true, st: "n", lbl: funded ? "Next · quarterly" : "Not started",
        ln: funded ? "S&O reports findings and decisions to the Steering Committee: continue, scale, pause or stop" : "Only if funded" }
    ];
    return { decision: d, why: why, next: next, route: route, checks: checks, reward: reward, reds: reds, ambers: ambers, funded: funded };
  }

  function evaluate() {
    stopAnyVoice();
    state.screen = "eval"; setHeader();
    app.innerHTML = '<div class="card loading">Evaluating against the guardrails…</div>';
    var p = sampler ? aiRatings().catch(function () { return null; }) : Promise.resolve(null);
    p.then(function (ev) {
      if (!ev) ev = { rows: offlineRatings(), summary: "", payback: "", mode: "Rule-based evaluation against the guardrails" + (sampler ? " (AI evaluation was unavailable)" : "") };
      ev.d = decide(ev); result = ev; renderEval();
    });
  }

  function numbersStrip(ev, retFiles) {
    var A_ = state.answers, f = figures(A_.r1), amount = moneyM(A_.a1);
    var byId = {}; ev.rows.forEach(function (r) { byId[r.id] = r; });
    var pb = maxNum(A_.r2); if (pb !== null && has(A_.r2, /year/) && !has(A_.r2, /month/)) pb = pb * 12;
    var dn = downsideMonths(A_.r3);
    function tile(t, v, sub, rag) { return '<div class="num"><div class="t">' + (rag ? '<span class="dot ' + rag + '"></span>' : "") + esc(t) + '</div><div class="v">' + esc(v) + '</div><div class="s">' + esc(sub) + '</div></div>'; }
    return '<div class="numbers">' +
      tile("Ask", amount !== null ? "$" + amount + "M" : "—", byId.p4a && byId.p4a.rag === "g" ? "Released in instalments" : "Instalments to be agreed", null) +
      tile("Payback", pb !== null ? pb + " months" : "Not given", "Hurdle [24 months]" + (f && f.payback !== null ? " · figures imply ~" + f.payback : ""), byId.r2 && byId.r2.rag) +
      tile("Downside payback", dn !== null ? dn + " months" : "Not given", "Limit [36 months]", byId.r3 && byId.r3.rag) +
      tile("3-year revenue vs cost", f ? "$" + f.rev + "M / $" + f.cost + "M" : (retFiles.length ? "See business case" : "Not given"), f ? "Net $" + f.net + "M over " + f.years + " years" : "Finance to work out", byId.r1 && byId.r1.rag) +
      '</div>';
  }

  function renderEval() {
    if (!result) { state.screen = "review"; render(); return; }
    var ev = result, d = ev.d;
    var name = (state.answers.a1 || "Investment request").trim().split(/:\s*\$/)[0];
    var amount = moneyM(state.answers.a1);
    var owner = short(state.answers.b3, 40);
    var today = new Date().toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
    var retFiles = files.ret || [], fl = allFiles();
    var autoSummary = ev.summary ||
      ("Strongest areas: " + (SECTIONS.filter(function (s) { return !s.prefilled && ev.rows.filter(function (r) { return r.sec.id === s.id; }).every(function (r) { return r.rag === "g"; }); }).map(function (s) { return s.title.replace(/\?$/, ""); }).join("; ") || "none fully green") + ". " +
       (d.reds.length ? "Main gaps: " + d.reds.slice(0, 3).map(function (r) { return r.note.toLowerCase(); }).join("; ") + "." :
        d.ambers.length ? "Main open points: " + d.ambers.slice(0, 3).map(function (r) { return r.note.toLowerCase(); }).join("; ") + "." : "No open points."));

    function list(items, empty, useCond) {
      return items.length ? "<ol>" + items.map(function (r) { return "<li>" + esc(useCond ? (r.condition || r.q.c) : r.note) + ' <span class="muted">(' + esc(r.sec.title.replace(/\?$/, "")) + ")</span></li>"; }).join("") + "</ol>" : '<div class="none">' + empty + "</div>";
    }

    app.innerHTML =
      '<div class="card">' +
      '<div class="eyebrow">Evaluation summary</div><h1 style="margin-bottom:0">' + esc(short(name, 110)) + '</h1>' +
      '<div class="meta"><span class="chip">Archetype ' + ARCH.code + ' · ' + esc(ARCH.short) + '</span>' +
      (amount !== null ? '<span class="chip">Ask: $' + amount + 'M</span>' : "") +
      (owner ? '<span class="chip">Owner: ' + esc(owner) + '</span>' : "") +
      '<span class="chip">' + esc(today) + '</span></div>' +

      '<div class="decision ' + DEC[d.decision] + '"><div class="lbl">Recommendation</div><div class="val">' + esc(d.decision) + '</div><p>' + esc(d.why) + '</p></div>' +

      '<div class="sect-h">The numbers</div>' + numbersStrip(ev, retFiles) +
      '<div class="sect-h">The three checks</div>' +
      '<div class="checks">' + d.checks.map(function (c) {
        return '<div class="chk"><div class="t">' + esc(c.t) + '</div><div class="s"><span class="dot ' + c.rag + '"></span>' + esc(c.line) + '</div></div>';
      }).join("") + '</div>' +

      '<div class="cols">' +
        '<div class="box"><h3>Conditions to attach</h3>' + list(d.ambers, "None", true) + '</div>' +
        '<div class="box"><h3>Must fix before funding</h3>' + list(d.reds, "None", false) + '</div>' +
      '</div>' +

      '<div class="sect-h">The REWARD view</div>' +
      '<div class="rw-legend">R, E and W happen now, before money goes out. A, R and D are the next steps once it is funded.</div>' +
      '<div class="reward">' + d.reward.map(function (x) {
        return '<div class="rw' + (x.cur ? " cur" : "") + (x.next ? " next" : "") + '"><div class="L">' + x.L + '</div><div class="nm">' + esc(x.nm) + '</div><div class="st"><span class="dot ' + x.st + '"></span>' + esc(x.lbl) + '</div><div class="ln">' + esc(x.ln) + '</div></div>';
      }).join("") + '</div>' +

      '<div class="route"><p><b>Summary:</b> ' + esc(autoSummary) + '</p>' +
      '<p><b>Finance check:</b> Confirm the revenue and cost assumptions against the baseline' + (retFiles.length ? ' and the attached business case (' + esc(retFiles.map(function (f) { return f.name; }).join(", ")) + ')' : '') + ', then the payback against the [24-month] hurdle and the downside against [36 months].' + (ev.payback ? ' AI estimate: ' + esc(ev.payback) : '') + '</p>' +
      '<p><b>Next step:</b> ' + esc(d.next) + '</p>' +
      (d.route ? '<p><b>Who decides:</b> ' + esc(d.route) + '</p>' : "") +
      (fl.length ? '<p><b>Evidence attached:</b> ' + esc(fl.map(function (x) { return x.f.name; }).join(", ")) + '</p>' : "") + '</div>' +

      '<details><summary>See every answer’s rating</summary><table><tr><th></th><th>Question</th><th>Rating</th></tr>' +
      ev.rows.map(function (r) { return '<tr><td><span class="dot ' + r.rag + '"></span></td><td>' + esc(r.q.q) + '</td><td>' + esc(r.note) + '</td></tr>'; }).join("") +
      '</table></details>' +
      '<div class="foot">' + esc(ev.mode) + '. Values in [ ] are indicative. This recommendation supports the Review Forum and Steering Committee; it is not the decision itself.</div>' +
      '</div>' +
      '<div class="nav no-print"><button class="btn" id="edit">← Edit answers</button><div style="display:flex;gap:10px;flex-wrap:wrap">' +
      '<button class="btn" id="print">Print / save as PDF</button><button class="btn primary" id="restart">Start over</button></div></div>';
  }

  // =================== Events ===================
  function resetAll() {
    Object.keys(audio).forEach(function (k) { URL.revokeObjectURL(audio[k]); });
    allFiles().forEach(function (x) { URL.revokeObjectURL(x.f.url); });
    audio = {}; files = {}; result = null;
    state = { screen: "start", step: 0, answers: freshAnswers() }; save();
  }
  app.addEventListener("input", function (e) {
    if (e.target.tagName === "TEXTAREA") { state.answers[e.target.dataset.id] = e.target.value; save(); grow(e.target); }
  });
  app.addEventListener("change", function (e) {
    if (e.target.type === "file" && e.target.files.length) { addFiles(e.target.dataset.sec, e.target.files); e.target.value = ""; }
  });
  app.addEventListener("click", function (e) {
    var t = e.target.closest("button"); if (!t) return;
    if (t.classList.contains("mic")) { toggleMic(t.dataset.id); return; }
    if (t.dataset.attach) { document.getElementById("in-" + t.dataset.attach).click(); return; }
    if (t.dataset.rm) {
      var p = t.dataset.rm.split(":"), arr = files[p[0]] || [], f = arr[+p[1]];
      if (f) { URL.revokeObjectURL(f.url); arr.splice(+p[1], 1); }
      document.getElementById("files-" + p[0]).innerHTML = fileChips(p[0], true); return;
    }
    if (t.dataset.edit !== undefined) { state.step = +t.dataset.edit; state.screen = "section"; render(); return; }
    switch (t.id) {
      case "begin": state.screen = "section"; state.step = 0; render(); break;
      case "sample": var a = freshAnswers(); Object.keys(SAMPLE).forEach(function (k) { a[k] = SAMPLE[k]; }); state.answers = a; save(); state.screen = "review"; render(); break;
      case "clear": resetAll(); render(); break;
      case "prev": stopAnyVoice(); if (state.screen === "review") { state.screen = "section"; state.step = SECTIONS.length - 1; } else if (state.step === 0) state.screen = "start"; else state.step--; render(); break;
      case "next": stopAnyVoice(); if (state.step === SECTIONS.length - 1) state.screen = "review"; else state.step++; render(); break;
      case "evaluate": evaluate(); break;
      case "edit": state.screen = "review"; render(); break;
      case "print": window.print(); break;
      case "restart": resetAll(); render(); break;
    }
  });

  render();
})();
</script>
</body>
</html>
